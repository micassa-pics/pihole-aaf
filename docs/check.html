<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>awesome-a-fyer patch versions</title>
<style>
:root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; }
body { max-width: 42rem; margin: 8vh auto; padding: 0 1rem; }
h1 { font-size: 1.5rem; } li { margin-block: .6rem; }
</style>
<h1>awesome-a-fyer patch versions</h1>
<p id="status"></p>
<a href="https://github.com/micassa-pics/pihole-awesome-a-fyer/blob/main/prompts/manage.md">Open the update prompt</a>
<script>
const latest = "1.1.37";
const installed = new URLSearchParams(location.hash.slice(1));
const pages = [["dashboard", "Dashboard"], ["dhcp", "DHCP"], ["queries", "Query Log"]].filter(([key]) => installed.has(key));
const older = pages.filter(([key]) => {
  const value = installed.get(key);
  if (!/^\d+\.\d+\.\d+$/.test(value)) return true;
  const parts = value.split(".").map(Number);
  return latest.split(".").map((n, i) => Number(n) - parts[i]).find(delta => delta !== 0) > 0;
});
const status = older.length ? "Update available for " + older.map(([, name]) => name).join(" and ") :
  pages.length ? "Installed pages are up to date" : "Latest release";
document.getElementById("status").textContent = status + " · awesome-a-fyer v" + latest;
</script>
</html>
