<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>awesome-a-fyer patch versions</title>
<style>
:root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; }
body { max-width: 42rem; margin: 8vh auto; padding: 0 1rem; }
h1 { font-size: 1.5rem; } li { margin-block: .6rem; }
</style>
<h1>awesome-a-fyer patch versions</h1>
<ul id="versions"></ul>
<a href="https://github.com/micassa-pics/pihole-awesome-a-fyer/blob/main/prompts/manage.md">Open the update prompt</a>
<script>
const latest = { dhcp: "1.1.0", queries: "1.1.0" };
const installed = new URLSearchParams(location.hash.slice(1));
for (const [key, name] of [["dhcp", "DHCP"], ["queries", "Query Log"]]) {
  if (installed.size && !installed.has(key)) continue;
  const current = installed.get(key);
  const available = latest[key];
  let text = name + " — latest version " + available;
  if (current && /^\d+\.\d+\.\d+$/.test(current)) {
    const local = current.split(".").map(Number);
    const difference = available.split(".").map((part, i) => Number(part) - local[i]).find(n => n !== 0);
    const status = difference > 0 ? "Update available" : difference < 0 ? "Installed version is newer" : "Up to date";
    text = name + " — " + status + " (installed " + current + ", latest " + available + ")";
  }
  const item = document.createElement("li");
  item.textContent = text;
  document.getElementById("versions").append(item);
}
</script>
</html>
